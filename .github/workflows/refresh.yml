name: refresh

# Keeps the page true and current. Commits only when the underlying facts have
# moved, so a quiet six hours produces no commit and no noise in the history.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recount the figures and rebuild the activity strip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh.py | tee refresh.log

      - name: Commit only if something actually changed
        run: |
          if git diff --quiet -- index.html; then
            echo "nothing changed"
            exit 0
          fi
          if grep -q '^FIGURE' refresh.log; then
            summary="Correct figures that drifted from the source data"
          else
            summary="Refresh the activity strip"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "$summary" -m "$(grep -E '^(FIGURE|activity:)' refresh.log || true)"
          git push
